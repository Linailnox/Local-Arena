name: Build

on:
  push:
    branches:
      - "update"
      - "build"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    name: Panel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('Panel/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: Panel
        run: bun install --frozen-lockfile

      - name: Frontend gates
        working-directory: Panel
        run: |
          bun run test:stickers
          bun run test:install-gate

      # Build only: no bundles and no updater signing on pull-request-style CI.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: Panel
          tauriScript: bun tauri
          uploadUpdaterJson: false
          args: --no-bundle

  plugins:
    name: Plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            linux: false
          - os: ubuntu-latest
            linux: true
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Prepare build hooks
        shell: pwsh
        run: 'Set-Content -Path .local-build.ps1 -Value ''$DotNet = (Get-Command dotnet).Source'''

      - name: Get latest tag
        id: get_tag
        shell: pwsh
        run: |
          $latest_tag = git describe --tags --abbrev=0
          echo "LTAG=$latest_tag" >> $env:GITHUB_OUTPUT

      - name: Build and package plugin bundle
        shell: pwsh
        run: |
          $version = "${{ steps.get_tag.outputs.LTAG }}".TrimStart("v")
          $arguments = @{ ReleaseVersion = $version }
          if ("${{ matrix.linux }}" -eq "true") { $arguments.Linux = $true }
          ./scripts/package.ps1 @arguments
          if ((git status --short --untracked-files=no).Length -ne 0) { git status --short; throw "Build modified tracked files" }

      - uses: actions/upload-artifact@v7
        with:
          name: LocalArena-plugin-${{ steps.get_tag.outputs.LTAG }}-${{ matrix.linux == true && 'linux' || 'windows' }}
          path: artifacts/LocalArena-plugin-${{ steps.get_tag.outputs.LTAG }}-${{ matrix.linux == true && 'linux' || 'windows' }}.zip
          archive: false
          if-no-files-found: error
