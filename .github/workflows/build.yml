name: Build
on:
  push:
    branches:
      - 'upsteam'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSBIP_UPDATE_SIGNING_KEY: ${{ secrets.CSBIP_UPDATE_SIGNING_KEY }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare build and signing tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pynacl
          $env:CARGO_HOME = Join-Path $PWD ".cache/cargo-home"
          New-Item -ItemType Directory -Path $env:CARGO_HOME -Force | Out-Null
          cargo install cargo-xwin --locked --root $env:CARGO_HOME

      - name: Build, test, and package
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles "LLVM/bin"
          if (-not (Test-Path (Join-Path $llvm "lld-link.exe"))) { throw "LLVM linker is unavailable: $llvm" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/package.ps1 -ReleaseVersion $version -LlvmBin $llvm -XwinCache (Join-Path $PWD ".cache/xwin") -OutputDirectory (Join-Path $PWD "artifacts")
          if ((git status --short --untracked-files=no).Length -ne 0) { git status --short; throw "Build modified tracked files" }
      - uses: actions/upload-artifact@v7
        with:
            name: LocalArena-${{ github.ref_name }}-windows.zip
            path:  artifacts/LocalArena-${{ github.ref_name }}-windows.zip
            archive: false
      - uses: actions/upload-artifact@v7
        with:
            name: LocalArena-panel-${{ github.ref_name }}-windows.zip
            path: artifacts/LocalArena-panel-${{ github.ref_name }}-windows.zip
            archive: false
      - uses: actions/upload-artifact@v7
        with:
            name: LocalArena-plugin-${{ github.ref_name }}-windows.zip
            path: artifacts/LocalArena-plugin-${{ github.ref_name }}-windows.zip
            archive: false
      - uses: actions/upload-artifact@v7
        with:
            name: latest.json
            path: artifacts/latest.json
            archive: false
      - uses: actions/upload-artifact@v7
        with:
            name: latest.json.sig
            path: artifacts/latest.json.sig
            archive: false
      - uses: actions/upload-artifact@v7
        with:
            name: SHA256SUMS.txt
            path: artifacts/SHA256SUMS.txt
            archive: false
