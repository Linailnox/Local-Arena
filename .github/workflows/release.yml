name: Build and release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload this manual build to the v<latest tag> GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag run publishes a release; never cancel it halfway. Manual runs are
  # validation/builds, so a newer run may replace an older one.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and trigger kind
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG=true
          else
            TAG=$(git describe --tags --abbrev=0)
            VERSION="${TAG#v}"
            IS_TAG=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Resolved version is not SemVer: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  panel:
    name: Panel bundle (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-latest
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: Panel
        run: bun install --frozen-lockfile

      - name: Frontend gates
        working-directory: Panel
        run: |
          bun run test:stickers
          bun run test:install-gate

      # One step for every trigger: tag pushes always publish, manual runs
      # publish only when upload_release is checked. An empty tagName makes
      # tauri-action build and sign without touching a Release.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: Panel
          tauriScript: bun tauri
          tagName: ${{ (needs.version.outputs.is_tag == 'true' || inputs.upload_release) && needs.version.outputs.tag || '' }}
          releaseName: ${{ (needs.version.outputs.is_tag == 'true' || inputs.upload_release) && format('Local Arena {0}', needs.version.outputs.tag) || '' }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          uploadUpdaterJson: ${{ needs.version.outputs.is_tag == 'true' || inputs.upload_release }}
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Panel artifacts
        if: needs.version.outputs.is_tag != 'true' && inputs.upload_release != true
        uses: actions/upload-artifact@v7
        with:
          name: LocalArena-panel-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          path: Panel/src-tauri/target/release/bundle/**/*
          archive: false
          if-no-files-found: error

  plugins:
    name: Plugin bundle (${{ matrix.os }})
    needs: [version, panel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            linux: false
            artifact: windows
          - os: ubuntu-latest
            linux: true
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Build and package plugin bundle
        shell: pwsh
        run: |
          $arguments = @{ ReleaseVersion = "${{ needs.version.outputs.version }}" }
          if ("${{ matrix.linux }}" -eq "true") { $arguments.Linux = $true }
          ./scripts/package.ps1 @arguments

      - name: Upload plugin bundle to the release
        if: needs.version.outputs.is_tag == 'true' || inputs.upload_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pluginZip = Get-ChildItem artifacts/LocalArena-plugin-*.zip | Select-Object -First 1
          if (-not $pluginZip) { throw "Plugin bundle was not produced." }
          gh release upload "${{ needs.version.outputs.tag }}" $pluginZip.FullName --clobber

      - name: Upload plugin artifact
        if: needs.version.outputs.is_tag != 'true' && inputs.upload_release != true
        uses: actions/upload-artifact@v7
        with:
          name: LocalArena-plugin-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          path: artifacts/LocalArena-plugin-*.zip
          archive: false
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, panel, plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checksums (release)
        if: needs.version.outputs.is_tag == 'true' || inputs.upload_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release
          gh release download "${{ needs.version.outputs.tag }}" --dir release --clobber
          cd release
          rm -f SHA256SUMS.txt
          find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt
          gh release upload "${{ needs.version.outputs.tag }}" SHA256SUMS.txt --clobber

      - name: Checksums (workflow artifacts)
        if: needs.version.outputs.is_tag != 'true' && inputs.upload_release != true
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Write checksums for workflow artifacts
        if: needs.version.outputs.is_tag != 'true' && inputs.upload_release != true
        run: |
          cd release
          find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Upload checksums
        if: needs.version.outputs.is_tag != 'true' && inputs.upload_release != true
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS-${{ needs.version.outputs.version }}
          path: release/SHA256SUMS.txt
          archive: false
