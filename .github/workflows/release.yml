name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  panel:
    name: Panel bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: Panel
        run: bun install --frozen-lockfile

      # tauri-action creates the release on the first matrix leg and updates it
      # on the next; uploadUpdaterJson merges the existing latest.json platforms
      # map before adding this leg's entry.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: Panel
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Local Arena ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  plugins:
    name: Plugin bundle (${{ matrix.os }})
    needs: panel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            linux: false
          - os: ubuntu-latest
            linux: true
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Prepare build hooks
        shell: pwsh
        run: 'Set-Content -Path .local-build.ps1 -Value ''$DotNet = (Get-Command dotnet).Source'''

      - name: Build and package plugin bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $arguments = @{ ReleaseVersion = $version }
          if ("${{ matrix.linux }}" -eq "true") { $arguments.Linux = $true }
          ./scripts/package.ps1 @arguments

      - name: Upload plugin bundle to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pluginZip = Get-ChildItem artifacts/LocalArena-plugin-*.zip | Select-Object -First 1
          if (-not $pluginZip) { throw "Plugin bundle was not produced." }
          gh release upload "${{ github.ref_name }}" $pluginZip.FullName --clobber

  checksums:
    name: Checksums
    needs: [panel, plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Collect release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release
          gh release download "${{ github.ref_name }}" --dir release --clobber
          cd release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
